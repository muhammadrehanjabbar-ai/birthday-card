<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #ffe6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #e91e63; font-size: 32px; margin-bottom: 10px; }
        p { color: #555; font-size: 18px; line-height: 1.5; }
        button {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background-color: #c2185b; transform: scale(1.05); }
        #surprise { display: none; margin-top: 20px; color: #d81b60; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <!-- Yahan unka name change kar lein -->
        <p>Dear <b>Birthday Girl</b>,</p>
        <p>Wishing you a magical day filled with joy, laughter, and unforgettable moments! ✨</p>
        
        <button onclick="showSurprise()">🎁 Click for Surprise!</button>
        <div id="surprise">💖 May all your dreams come true! Have a fantastic year ahead! 🎈</div>
    </div>

    <script>
        function showSurprise() {
            document.getElementById('surprise').style.display = 'block';
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
