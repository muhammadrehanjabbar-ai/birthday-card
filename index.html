<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 350px;
            width: 85%;
            backdrop-filter: blur(5px);
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 10;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff4b2b;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.3);
            margin-bottom: 15px;
        }

        h1 {
            color: #ff2a5f;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #4a4a4a;
            font-size: 15px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #message {
            display: none;
            margin-top: 15px;
            font-weight: bold;
            color: #d81b60;
            animation: popup 0.5s ease-in-out;
        }

        /* Heart Floating Animation */
        .heart {
            position: absolute;
            color: #ff2a5f;
            font-size: 20px;
            animation: float 4s linear infinite;
            bottom: -20px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popup {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Apni pasand ki image ka URL lagayein -->
        <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=300" class="profile-img" alt="Birthday Girl">
        
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>Dear <b>Birthday Girl</b>,</p>
        <p>Wishing you a day filled with endless love, happiness, and magical moments! ✨</p>

        <button class="btn" onclick="playSurprise()">🎁 Tap For Surprise!</button>

        <div id="message">💖 May your year ahead be as beautiful and glowing as you are! 🎈🥳</div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

    <script>
        function playSurprise() {
            // Play Music
            var audio = document.getElementById("bg-music");
            audio.play();

            // Show Message
            document.getElementById('message').style.display = 'block';

            // Confetti Explosion
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // Floating Hearts Logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
